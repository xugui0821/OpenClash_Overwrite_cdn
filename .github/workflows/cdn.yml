name: 自动同步上游并替换 CDN 链接

on:
  schedule:
    # 定时任务：每天 UTC 0点和12点（北京时间 8:00 和 20:00）自动运行
    # 你可以根据需要调整频率，例如 '0 * * * *' 代表每小时运行一次
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击触发，方便测试

jobs:
  sync-and-replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 GITHUB_TOKEN 写入代码库的权限

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须设置为 0，获取完整历史记录才能进行合并

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 同步上游更新 (Sync from Upstream)
        id: sync
        run: |
          # ==========================================
          # ⚠️ 请将下方的 URL 替换为你 Fork 的真正的上游仓库地址！
          # 例如：https://github.com/Giveupmoon/OpenClash_Overwrite.git
          # ==========================================
          UPSTREAM_REPO="https://github.com/Giveupmoon/OpenClash_Overwrite.git"
          UPSTREAM_BRANCH="main" # 如果上游默认分支叫 master，请改为 master

          # 添加上游仓库为远程节点
          git remote add upstream $UPSTREAM_REPO
          git fetch upstream

          # 检查上游是否有新提交
          LOCAL_HEAD=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse upstream/$UPSTREAM_BRANCH)

          echo "本地 HEAD: $LOCAL_HEAD"
          echo "上游 HEAD: $UPSTREAM_HEAD"

          if [ "$LOCAL_HEAD" = "$UPSTREAM_HEAD" ]; then
            echo "上游没有新提交，跳过合并"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 合并上游分支
          # 使用 -X theirs 策略：如果上游的代码和我们的替换代码发生冲突，优先采用上游的最新代码。
          # 因为下一步我们马上会重新运行替换脚本，所以不用担心旧链接覆盖我们的新链接。
          if git merge -X theirs upstream/$UPSTREAM_BRANCH -m "Merge upstream updates"; then
            echo "合并成功"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "合并失败或无需合并"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 批量替换文件中的链接 (Replace URLs)
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          # 查找文件并执行多重替换
          find . -type f -not -path "*/\.git/*" -not -path "*/\.github/*" -exec sed -i \
          's|https://raw\.githubusercontent\.com/Giveupmoon/OpenClash_Overwrite/refs/heads/main/Yaml|https://testingcf.jsdelivr.net/gh/xugui0821/OpenClash_Overwrite_cdn@main/Yaml|g' {} +

          # 2. 执行通用的正则替换，处理剩下的常规 raw 链接
          find . -type f -not -path "*/\.git/*" -not -path "*/\.github/*" -exec sed -E -i \
          's|https://raw\.githubusercontent\.com/+([^/]+)/([^/]+)/([^/]+)/|https://testingcf.jsdelivr.net/gh/\1/\2@\3/|g' {} +

      - name: 提交并推送更改 (Commit & Push)
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          # 先将所有更改加入暂存区
          git add -A

          # 检查是否有需要提交的更改（包括 merge commit 和 sed 替换）
          if git diff --cached --quiet; then
            # 没有暂存的文件更改，但可能有 merge commit 需要 push
            # 检查本地是否领先于远端
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/${{ github.ref_name }})

            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "本地领先于远端，推送 merge commit"
              git push origin ${{ github.ref_name }}
            else
              echo "没有需要推送的更改"
            fi
          else
            # 有暂存的更改，提交并推送
            git commit -m "chore: 同步上游更新并替换为 jsDelivr CDN 链接"
            git push origin ${{ github.ref_name }}
          fi
